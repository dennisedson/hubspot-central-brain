# Prints the OIDC claims GitHub presents to Anthropic, so a federation rule can
# be matched against them.
#
# WHY THIS EXISTS
# ---------------
# The review bot fails with:
#
#   Token exchange failed with status 401:
#   {"error":{"type":"authentication_error","message":"Authentication failed"}}
#   Ensure your federation rule matches your identity token.
#
# The repository secrets are set and do reach the action. What is not visible
# from either side is which claims the token actually carries — so this prints
# them, and the federation rule in Claude Console can be compared against the
# real values rather than against what they are assumed to be.
#
# It NEVER prints the token. Only the claims used for matching, which are facts
# about the repository and the run, not credentials.
#
# Run it from Actions → "Claude OIDC claims (debug)" → Run workflow. Delete this
# file once the rule matches.
name: Claude OIDC claims (debug)

on:
  workflow_dispatch:
    inputs:
      audience:
        description: 'Audience to request. The action defaults to https://api.anthropic.com'
        required: false
        default: 'https://api.anthropic.com'

jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Show the claims this repository presents
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}") || {
              echo "::error::Could not reach the GitHub OIDC token endpoint."
              exit 1
            }

          TOKEN=$(echo "$RESPONSE" | jq -r '.value // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::OIDC endpoint returned no .value"
            exit 1
          fi
          # Mask it immediately. Nothing below echoes it.
          echo "::add-mask::$TOKEN"

          # Payload is the second dot-separated segment, base64url. Pad it so
          # base64 -d accepts it.
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          CLAIMS=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)

          echo "These are the values a federation rule must match."
          echo
          echo "$CLAIMS" | jq '{
            iss, aud, sub,
            repository, repository_owner, repository_id, repository_owner_id,
            ref, ref_type, ref_protected,
            event_name, workflow, workflow_ref, job_workflow_ref,
            environment, runner_environment, actor
          }'
          echo
          echo "Most federation rules match on sub, repository and aud."
          echo "A rule pinned to a branch will NOT match a pull_request run:"
          echo "  ref is a merge ref and sub carries pull_request, not refs/heads/<branch>."
        env:
          AUDIENCE: ${{ inputs.audience }}
