# Daily check that every external credential this app depends on still works.
#
# WHY
# ---
# Three credentials have died silently here: the HubSpot service key (a day to
# diagnose), the YouTube refresh token, and ANTHROPIC_API_KEY — invalid in
# .env and on both portals at once, unnoticed because nothing had ever called
# Anthropic for real until the changelog card did.
#
# `npm run preflight` would not have caught any of them. All thirteen of its
# checks are structural: object ids, pipelines, stages, properties. A revoked
# key passes every one.
#
# This asks the PORTAL to check its own secrets, because the credentials live in
# four separate homes and validating a copy here would prove nothing about the
# one the running functions actually use.
name: Credential Health

on:
  schedule:
    # 13:00 UTC daily — morning in US Eastern, so a failure is seen the same day.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Both portals are reported even when the first is broken.
      fail-fast: false
      matrix:
        include:
          - portal: dev
            environment: dev
            portalId: '51869810'
            secretName: HUBSPOT_DEV_SYNC_SECRET
          - portal: prod
            environment: Prod
            portalId: '22047910'
            secretName: HUBSPOT_PROD_SYNC_SECRET
    environment: ${{ matrix.environment }}
    steps:
      - name: Ask portal ${{ matrix.portalId }} to check its own credentials
        env:
          # HUBSPOT_<PORTAL>_SYNC_SECRET, the name deploy-prod.yml and
          # script-env.ts already use. An earlier version invented
          # SYNC_SHARED_SECRET, which exists on the PORTAL as the function's env
          # var but not in GitHub — so this would have failed on both portals
          # from its first run.
          SECRET: ${{ secrets[matrix.secretName] }}
        run: |
          set -euo pipefail

          # A portal with no secret configured is not set up for health checks.
          # That is a warning, not a daily failure — the check exists to report
          # broken credentials, not to complain about portals nobody wired up.
          if [ -z "${SECRET:-}" ]; then
            echo "::warning::${{ matrix.secretName }} is not set for the ${{ matrix.environment }} environment — skipping ${{ matrix.portal }}."
            exit 0
          fi

          URL="https://${{ matrix.portalId }}.hs-sites.com/hs/serverless/app-health"

          # -f would hide the body, and the body is the whole point.
          HTTP=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --connect-timeout 10 --max-time 90 \
            -X POST "$URL" \
            -H 'content-type: application/json' \
            -d "{\"secret\":\"${SECRET}\",\"portalId\":\"${{ matrix.portalId }}\"}") || {
              echo "::error::Could not reach $URL"
              exit 1
            }

          if [ "$HTTP" != "200" ]; then
            echo "::error::${{ matrix.portal }} health endpoint returned HTTP $HTTP"
            head -c 400 /tmp/health.json || true
            exit 1
          fi

          echo "### ${{ matrix.portal }} (${{ matrix.portalId }})" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.checks[] | "- \(.name): \(.status) — \(.detail)"' /tmp/health.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

          # Named individually so the log says which one, not just that one failed.
          BROKEN=$(jq -r '[.checks[] | select(.status=="invalid" or .status=="error")] | .[].name' /tmp/health.json)
          if [ -n "$BROKEN" ]; then
            for name in $BROKEN; do
              DETAIL=$(jq -r --arg n "$name" '.checks[] | select(.name==$n) | .detail' /tmp/health.json)
              echo "::error title=${{ matrix.portal }}: $name::$DETAIL"
            done
            exit 1
          fi

          echo "All credentials on ${{ matrix.portal }} authenticated."
