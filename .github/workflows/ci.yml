# CI — runs on every pull request targeting main, staging, or develop
name: CI

on:
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # UI extension directories carry their own tsconfig and toolchain, so the
      # root typecheck cannot see them. Without these, card and page .tsx files
      # are only validated at `hs project upload` — after a push. (#6)
      - name: Typecheck UI extensions
        run: npm run typecheck:cards && npm run typecheck:pages && npm run typecheck:settings

  validate:
    name: HubSpot Dry-Run Validate
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Install HubSpot CLI
        uses: HubSpot/hubspot-project-actions/install-hubspot-cli@v1.1.0

      - name: Validate project
        uses: HubSpot/hubspot-project-actions/project-validate@v1.1.0
        env:
          DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_DEV_ACCOUNT_ID }}
          DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_DEV_PERSONAL_ACCESS_KEY }}
