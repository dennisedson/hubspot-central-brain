# Deploy to Staging — manual trigger only
name: Deploy › Staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build functions
        run: npm run build

      - name: Set sync function URLs
        run: |
          sed -i 's|${SYNC_TO_LINEAR_URL}|https://51869787.hs-sites.com/hs/serverless/sync-to-linear|g' src/app/workflow-actions/sync-to-linear-hsmeta.json
          sed -i 's|${SYNC_TO_ASANA_URL}|https://51869787.hs-sites.com/hs/serverless/sync-to-asana|g' src/app/workflow-actions/sync-to-asana-hsmeta.json
          sed -i 's|${ASANA_POLL_URL}|https://51869787.hs-sites.com/hs/serverless/asana-poll|g' src/app/workflow-actions/asana-poll-hsmeta.json
          sed -i 's|${FELLOW_SYNC_URL}|https://51869787.hs-sites.com/hs/serverless/fellow-sync|g' src/app/workflow-actions/fellow-sync-hsmeta.json
          sed -i 's|${CONTENT_OBJECT_TYPE_ID}|2-67508770|g' src/app/cards/task-status-hsmeta.json

      - name: Install HubSpot CLI
        uses: HubSpot/hubspot-project-actions/install-hubspot-cli@v1.1.0

      - name: Configure HubSpot CLI account
        env:
          DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_STAGING_ACCOUNT_ID }}
          DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_STAGING_PERSONAL_ACCESS_KEY }}
        run: |
          mkdir -p ~/.hscli
          printf "defaultAccount: ci\naccounts:\n  - name: ci\n    accountId: %s\n    env: prod\n    authType: personalaccesskey\n    personalAccessKey: '%s'\n    auth:\n      tokenInfo:\n        accessToken: null\n        expiresAt: null\n" \
            "$DEFAULT_ACCOUNT_ID" "$DEFAULT_PERSONAL_ACCESS_KEY" > ~/.hscli/config.yml

      - name: Upload project
        run: npx hs project upload --skip-auto-deploy
        env:
          DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_STAGING_ACCOUNT_ID }}
          DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_STAGING_PERSONAL_ACCESS_KEY }}

      - name: Deploy project
        run: npx hs project deploy --deploy-latest-build --force
        env:
          DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_STAGING_ACCOUNT_ID }}
          DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_STAGING_PERSONAL_ACCESS_KEY }}
