# Deploy to Production — auto-uploads on merge to main
name: Deploy › Production

on:
  push:
    branches: [master]

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload to Production
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build functions
        run: npm run build

      - name: Set sync function URL
        run: sed -i 's|${SYNC_TO_LINEAR_URL}|https://api.hubspot.com/integrations/v1/49129343/serverless/sync-to-linear|g' src/app/workflow-actions/sync-to-linear-hsmeta.json

      - name: Install HubSpot CLI
        uses: HubSpot/hubspot-project-actions/install-hubspot-cli@v1.1.0

      - name: Upload project
        uses: HubSpot/hubspot-project-actions/project-upload@v1.1.0
        env:
          DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_PROD_ACCOUNT_ID }}
          DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PROD_PERSONAL_ACCESS_KEY }}
