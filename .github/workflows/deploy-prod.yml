# Deploy to Prod — manual trigger only
name: Deploy › Prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload to Prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Prod had no typecheck at all. Dev has had one since the workflows were
      # written, so a UI extension that fails to compile would be caught on the
      # way to dev and then deployed to prod unchecked if it ever reached master
      # another way. Cheap, and it is the only compile-time gate prod gets:
      # HubSpot's own validate does not bundle extensions.
      - name: Typecheck cards, pages, settings
        run: npm run typecheck:cards && npm run typecheck:pages && npm run typecheck:settings

      - name: Build functions
        run: npm run build

      # Asserts prod's live schema matches portal-config BEFORE anything is
      # uploaded: object type ids, pipeline ids, stage ids, and every property
      # the app reads or writes.
      #
      # This is what replaced the staging environment. Deploying over
      # provisioning drift does not error — it produces records with blank
      # properties and syncs that report success while writing nothing, which
      # is the failure mode this project has produced most often.
      #
      # On its first run against prod it found the changelog pipeline missing
      # (#21) and four app_configs properties absent, which would have made a
      # successful YouTube connection read as "disconnected" in silence.
      - name: Preflight — does prod match portal-config?
        env:
          PORTAL: prod
          HUBSPOT_PROD_SERVICE_KEY: ${{ secrets.HUBSPOT_PROD_SERVICE_KEY }}
          HUBSPOT_PROD_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PROD_PERSONAL_ACCESS_KEY }}
          HUBSPOT_PROD_SYNC_SECRET: ${{ secrets.HUBSPOT_PROD_SYNC_SECRET }}
          HUBSPOT_PROD_DEVELOPER_KEY: ${{ secrets.HUBSPOT_PROD_DEVELOPER_KEY }}
          ASANA_API_KEY: ${{ secrets.ASANA_API_KEY }}
        run: npm run preflight

      # Rewrites every workflow-action actionUrl to this portal and FAILS the
      # deploy if any is left pointing elsewhere. The per-file seds this
      # replaced matched ${...} placeholders that no longer exist, so they
      # silently no-opped and shipped dev URLs to prod.
      - name: Point workflow action URLs at this portal
        run: .github/scripts/set-action-urls.sh 22047910

      - name: Install HubSpot CLI
        uses: HubSpot/hubspot-project-actions/install-hubspot-cli@v1.1.0

      - name: Configure HubSpot CLI account
        env:
          DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_PROD_ACCOUNT_ID }}
          DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PROD_PERSONAL_ACCESS_KEY }}
        run: |
          mkdir -p ~/.hscli
          printf "defaultAccount: ci\naccounts:\n  - name: ci\n    accountId: %s\n    env: prod\n    authType: personalaccesskey\n    personalAccessKey: '%s'\n    auth:\n      tokenInfo:\n        accessToken: null\n        expiresAt: null\n" \
            "$DEFAULT_ACCOUNT_ID" "$DEFAULT_PERSONAL_ACCESS_KEY" > ~/.hscli/config.yml

      - name: Upload project
        run: npx hs project upload --skip-auto-deploy
        env:
          DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_PROD_ACCOUNT_ID }}
          DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PROD_PERSONAL_ACCESS_KEY }}

      - name: Deploy project
        run: npx hs project deploy --deploy-latest-build --force
        env:
          DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_PROD_ACCOUNT_ID }}
          DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PROD_PERSONAL_ACCESS_KEY }}
